name: Update J Launcher metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: update-j-launcher-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out J Launcher metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: j-meta

      - name: Check out Prism compatibility metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: PrismLauncher/meta-launcher
          ref: master
          path: prism-meta
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Refresh generated metadata
        run: >-
          python j-meta/tools/refresh_metadata.py
          --upstream prism-meta
          --destination j-meta

      - name: Test the refresh tool
        working-directory: j-meta
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Validate generated changes
        working-directory: j-meta
        run: git diff --check

      - name: Commit refreshed metadata
        working-directory: j-meta
        shell: bash
        run: |
          if git diff --quiet && test -z "$(git status --short)"; then
            echo "Metadata is already current."
            exit 0
          fi
          git config user.name "J Launcher metadata bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Update metadata $(date -u +%F)"
          git push
